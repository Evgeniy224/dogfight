<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dogfight — Lab 04</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }
      
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #0f0;
        font-family: monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px;
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
        line-height: 1.4;
      }

      #loading-screen, #lobby-screen {
        position: fixed;
        inset: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: monospace;
        z-index: 100;
      }
      .hidden { display: none !important; }

      #progress-bar {
        width: 300px;
        height: 20px;
        border: 2px solid #444;
        margin-top: 20px;
      }
      #progress-fill {
        height: 100%;
        background: #4af;
        width: 0%;
        transition: width 0.1s;
      }
      #progress-text { margin-top: 10px; }

      #rooms-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }
      .room-btn {
        padding: 10px 20px;
        background: #222;
        border: 2px solid #444;
        color: #fff;
        font-family: monospace;
        cursor: pointer;
      }
      .room-btn:hover { background: #333; }
      .room-btn.selected { border-color: #4af; background: #1a3a5a; }
      #player-name {
        padding: 8px;
        background: #222;
        border: 2px solid #444;
        color: #fff;
        font-family: monospace;
      }
      #join-btn {
        padding: 10px 20px;
        background: #4af;
        border: none;
        color: #000;
        font-weight: bold;
        font-family: monospace;
        cursor: pointer;
      }

      /* ЧАТ */
      #chat-box {
        position: fixed;
        bottom: 10px;
        left: 10px;
        width: 300px;
        height: 200px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        padding: 8px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        z-index: 50;
        border: 1px solid #444;
      }
      #chat-box.hidden { display: none !important; }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 4px;
        word-wrap: break-word;
      }
      #chat-messages div { margin: 2px 0; }
      #chat-input {
        padding: 4px;
        background: #222;
        border: 1px solid #444;
        color: #fff;
        font-family: monospace;
        outline: none;
      }
      #chat-input:focus { border-color: #4af; }
    </style>
  </head>
  <body>
    <!-- Екран завантаження -->
    <div id="loading-screen">
      <h1>Loading...</h1>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <p id="progress-text">0 / 0</p>
    </div>

    <!-- Екран лобі -->
    <div id="lobby-screen" class="hidden">
      <h1>Dogfight</h1>
      <p>Choose a room:</p>
      <div id="rooms-list"></div>
      <div style="margin-top: 20px;">
        <input type="text" id="player-name" placeholder="Your name" value="Player" />
        <button id="join-btn">Join</button>
      </div>
    </div>

    <canvas id="game"></canvas>
    <div id="hud"></div>

    <!-- Чат (спочатку прихований) -->
    <div id="chat-box" class="hidden">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Type a message... (Enter)" />
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
